[build-system]
requires = [
  "setuptools>=42",
  "cmake>=3.27",
  "mlx==0.32.2",
  "nanobind==2.15.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-mlx"
version = "0.0.1"
description = "Native MLX inference for SmolVLA on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "huggingface-hub==1.29.0",
  "mlx==0.32.2",
  "numpy==2.2.6",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
]

[project.scripts]
smolvla-mlx = "smolvla_mlx.cli:main"

[project.optional-dependencies]
reference = [
  "lerobot[dataset,smolvla]==0.6.1; python_version >= '3.12'",
  "torch==2.11.0; python_version >= '3.12'",
]
serve = [
  "lerobot[async]==0.6.1; python_version >= '3.12'",
]
train = [
  "lerobot[dataset,smolvla]==0.6.1; python_version >= '3.12'",
  "torch==2.11.0; python_version >= '3.12'",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
markers = [
  "slow: integration tests that load model or dataset assets",
]
