[build-system]
requires = [
  "setuptools>=42",
  "cmake>=3.27",
  "mlx==0.32.2",
  "nanobind==2.15.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-mlx"
version = "0.0.1"
description = "Native MLX inference for SmolVLA on Apple Silicon"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "huggingface-hub",
  "mlx",
  "mlx-vlm",
  "numpy",
  "pillow",
  "safetensors",
  "tokenizers",
]

[project.optional-dependencies]
reference = [
  "lerobot[dataset,smolvla]==0.6.1",
  "torch==2.11.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
markers = [
  "slow: integration tests that load model or dataset assets",
]
