[build-system]
requires = [
  "setuptools>=42",
  "cmake>=3.27",
  "mlx==0.32.2",
  "nanobind==2.15.0",
]
build-backend = "reference._build_backend"
backend-path = ["."]

[project]
name = "mlx-smolvla"
version = "0.1.0"
description = "Native MLX inference, serving, and training tools for SmolVLA on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
  "apple-silicon",
  "lerobot",
  "mlx",
  "robotics",
  "smolvla",
  "vision-language-action",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub==1.29.0",
  "mlx>=0.32.0,<0.32.3",
  "numpy==2.2.6",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
]

[project.urls]
Changelog = "https://github.com/daniiarabdiev/mlx-smolvla/blob/main/CHANGELOG.md"
Documentation = "https://github.com/daniiarabdiev/mlx-smolvla/tree/main/docs"
Homepage = "https://github.com/daniiarabdiev/mlx-smolvla"
Issues = "https://github.com/daniiarabdiev/mlx-smolvla/issues"
Repository = "https://github.com/daniiarabdiev/mlx-smolvla"

[project.scripts]
mlx-smolvla = "mlx_smolvla.cli:main"

[project.optional-dependencies]
reference = [
  "lerobot[dataset,smolvla]==0.6.1; python_version >= '3.12'",
  "torch==2.11.0; python_version >= '3.12'",
]
serve = [
  "lerobot[async]==0.6.1; python_version >= '3.12'",
]
train = [
  "lerobot[dataset,smolvla]==0.6.1; python_version >= '3.12'",
  "torch==2.11.0; python_version >= '3.12'",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
markers = [
  "slow: integration tests that load model or dataset assets",
]
